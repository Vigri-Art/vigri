name: Continuous Integration - Test Auth

on:
  # Trigger the workflow on pushes to main and on pull requests
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allow manual running
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run E2E Tests (Playwright)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install Playwright browsers needed for testing
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install Dependencies
        run: npm ci

      # 🛑 Set Environment Variables for CI 🛑
      - name: Set Environment Variables
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          # IMPORTANT: Use dedicated testing credentials or ensure your test user is managed
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "PORT=3000" >> $GITHUB_ENV # Ensure local dev server uses a fixed port

      - name: Build Next.js App
        run: npm run build
      
      - name: Start Next.js App (as background service)
        run: npm start &
        # Give the server a moment to boot up before running tests
        # We start the app in the background (&) so the workflow doesn't get stuck
        # and wait for the tests to proceed.
      
      - name: Wait for server to be ready
        # Wait 30 seconds for the application to be ready on port 3000
        uses: wait-on/action@v1
        with:
          resource: http://localhost:3000
          timeout: 60000 
          
      - name: Run Playwright Tests
        run: npx playwright test
        env:
          # Ensure Playwright knows where the running server is
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          
      - name: Upload Playwright Test Reports (on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/